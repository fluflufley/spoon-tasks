name: Send task reminders

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Send due reminders
        run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
